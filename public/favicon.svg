<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163366" />
      <stop offset="100%" stop-color="#0C1E40" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC820" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with Subtle Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#FFB800" stroke-opacity="0.3" stroke-width="4" />

  <!-- Logo Mark (Centered Door Step BD Power Plant Emblem) -->
  <g transform="translate(19.2, 70.4) scale(6.4)">
    <!-- Steam Clouds Above Chimneys -->
    <path
      d="M13 14 C13 9 18 7 22 9 C25 6 29 6 32 9 C35 9 38 12 38 15 C38 18 35 20 32 20 H16 C13 20 11 18 11 16 C11 15 12 14 13 14 Z"
      fill="#94A3B8"
      opacity="0.9"
    />
    <path
      d="M26 9 C26 6 29 4 33 6 C35 4 38 4 41 6 C43 6 45 8 45 11 C45 13 43 15 40 15 H30 C27 15 25 13 25 11 C25 10 26 9 26 9 Z"
      fill="#CBD5E1"
      opacity="0.8"
    />

    <!-- Chimney / Smokestack with Yellow Top Cap -->
    <path
      d="M14 50 L17 23 H25 L27 50 Z"
      fill="#FFFFFF"
    />
    <rect
      x="15.5"
      y="21"
      width="11"
      height="3.5"
      rx="1"
      fill="url(#goldGrad)"
    />

    <!-- Industrial Power Station Factory with Sawtooth Roofs -->
    <path
      d="M25 50 V31 L37 20 V31 L49 20 V31 L61 20 V50 H25 Z"
      fill="#FFFFFF"
    />

    <!-- High-Tech Windows / Power Grid Accents -->
    <rect x="31" y="37" width="4.5" height="7.5" rx="0.75" fill="url(#goldGrad)" />
    <rect x="40" y="37" width="4.5" height="7.5" rx="0.75" fill="url(#goldGrad)" />
    <rect x="49" y="37" width="4.5" height="7.5" rx="0.75" fill="url(#goldGrad)" />

    <!-- Foundation Base Line -->
    <rect
      x="10"
      y="50"
      width="54"
      height="4.5"
      rx="1.5"
      fill="#FFFFFF"
    />
  </g>
</svg>