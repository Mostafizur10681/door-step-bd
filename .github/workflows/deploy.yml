name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: 22

          script: |
            set -e

            # =========================================
            # Environment Setup
            # =========================================
            if [ -d "/home/doorstep-deploy/.nvm" ]; then
              export HOME="/home/doorstep-deploy"
              export NVM_DIR="/home/doorstep-deploy/.nvm"
              export PM2_HOME="/home/doorstep-deploy/.pm2"
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            elif [ -d "$HOME/.nvm" ]; then
              export NVM_DIR="$HOME/.nvm"
              export PM2_HOME="$HOME/.pm2"
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            fi

            if command -v nvm >/dev/null 2>&1; then
              nvm use 20.20.2 2>/dev/null || nvm use 20 2>/dev/null || nvm use default 2>/dev/null || true
            fi

            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.npm-global/bin:$HOME/.local/bin"

            echo "========================================="
            echo "🔧 Environment"
            echo "========================================="
            echo "User: $(whoami)"
            echo "Node: $(node -v 2>/dev/null || echo 'Not found')"
            echo "NPM: $(npm -v 2>/dev/null || echo 'Not found')"
            echo "PM2: $(pm2 -v 2>/dev/null || echo 'Not found')"

            # =========================================
            # Git Directory Configuration
            # =========================================
            git config --global --add safe.directory /var/www/doorstepbd.org || true

            cd /var/www/doorstepbd.org

            echo "========================================="
            echo "🚀 Deploying Door Step BD"
            echo "📁 /var/www/doorstepbd.org"
            echo "========================================="

            # =========================================
            # Pull Latest Code
            # =========================================
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # =========================================
            # Clean Next.js Cache & Build Artifacts
            # =========================================
            echo "🧹 Cleaning previous build..."
            rm -rf .next

            # =========================================
            # Install Dependencies
            # =========================================
            echo "📦 Installing dependencies..."
            npm ci || npm install --legacy-peer-deps

            # =========================================
            # Configure Environment Variables
            # =========================================
            echo "⚙️ Configuring environment..."
            export NEXT_PUBLIC_API_URL="https://admin.doorstepbd.org"

            if [ ! -f ".env" ] || ! grep -q "^NEXT_PUBLIC_API_URL=" .env 2>/dev/null; then
              echo "NEXT_PUBLIC_API_URL=https://admin.doorstepbd.org" >> .env
            fi

            # =========================================
            # Build Next.js Application
            # =========================================
            echo "🏗️ Building Next.js application..."
            npm run build

            # =========================================
            # Restart Application via PM2
            # =========================================
            echo "🔄 Restarting application..."

            pm2 restart doorstepbd --update-env 2>/dev/null || pm2 restart 0 --update-env 2>/dev/null || pm2 restart all --update-env 2>/dev/null || pm2 start npm --name "doorstepbd" -- start || true

            if [ -d "/home/doorstep-deploy/.pm2" ]; then
              PM2_HOME="/home/doorstep-deploy/.pm2" pm2 restart doorstepbd --update-env 2>/dev/null || PM2_HOME="/home/doorstep-deploy/.pm2" pm2 restart all --update-env 2>/dev/null || true
            fi

            pm2 save 2>/dev/null || true

            # =========================================
            # Reload Web Server
            # =========================================
            echo "🌐 Reloading web server..."
            sudo systemctl reload nginx 2>/dev/null || sudo nginx -s reload 2>/dev/null || true

            echo "========================================="
            echo "✅ Deployment completed successfully!"
            echo "========================================="