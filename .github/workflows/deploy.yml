name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: 22

          script: |
            set -e

            # =========================================
            # Load NVM and Node environment
            # =========================================
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            if [ -d "/home/doorstep-deploy/.nvm" ]; then
              export NVM_DIR="/home/doorstep-deploy/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi

            if [ -d "/root/.nvm" ]; then
              export NVM_DIR="/root/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi

            if command -v nvm >/dev/null 2>&1; then
              nvm use 20.20.2 2>/dev/null || nvm use 20 2>/dev/null || nvm use default 2>/dev/null || nvm use --lts 2>/dev/null || true
            fi

            # Ensure all node, npm, and pm2 binary locations are in PATH
            if [ -d "/home/doorstep-deploy/.nvm/versions/node" ]; then
              LATEST_NODE_DIR=$(ls -d /home/doorstep-deploy/.nvm/versions/node/* 2>/dev/null | tail -n 1)
              [ -n "$LATEST_NODE_DIR" ] && export PATH="$LATEST_NODE_DIR/bin:$PATH"
            fi

            if [ -d "/root/.nvm/versions/node" ]; then
              LATEST_ROOT_NODE=$(ls -d /root/.nvm/versions/node/* 2>/dev/null | tail -n 1)
              [ -n "$LATEST_ROOT_NODE" ] && export PATH="$LATEST_ROOT_NODE/bin:$PATH"
            fi

            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.npm-global/bin:$HOME/.local/bin"

            echo "========================================="
            echo "🔧 Deployment Environment"
            echo "========================================="
            echo "User: $(whoami)"
            echo "Node: $(node -v 2>/dev/null || echo 'Not found in PATH')"
            echo "NPM: $(npm -v 2>/dev/null || echo 'Not found in PATH')"
            echo "PM2: $(pm2 -v 2>/dev/null || echo 'Not found in PATH')"

            # =========================================
            # Git Safe Directory
            # =========================================
            git config --global --add safe.directory /var/www/doorstepbd.org || true

            cd /var/www/doorstepbd.org

            echo "========================================="
            echo "🚀 Deploying Door Step BD"
            echo "📁 /var/www/doorstepbd.org"
            echo "========================================="

            # =========================================
            # Pull Latest Code
            # =========================================
            echo "📥 Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            # =========================================
            # Clean Previous Next.js Build
            # =========================================
            echo "🧹 Cleaning previous build cache..."
            rm -rf .next

            # =========================================
            # Install Dependencies
            # =========================================
            echo "📦 Installing dependencies..."
            npm ci || npm install --legacy-peer-deps

            # =========================================
            # Configure Production Environment
            # =========================================
            echo "⚙️ Configuring environment..."
            export NEXT_PUBLIC_API_URL="https://admin.doorstepbd.org"

            if [ ! -f ".env" ] || ! grep -q "^NEXT_PUBLIC_API_URL=" .env 2>/dev/null; then
              echo "NEXT_PUBLIC_API_URL=https://admin.doorstepbd.org" >> .env
            fi

            # =========================================
            # Build Next.js Application
            # =========================================
            echo "🏗️ Building Next.js application..."
            npm run build

            # =========================================
            # Ensure Proper File & Directory Permissions
            # =========================================
            echo "🔐 Setting readable permissions for Nginx and PM2..."
            chmod -R 755 /var/www/doorstepbd.org
            chmod -R 755 /var/www/doorstepbd.org/.next 2>/dev/null || true

            # =========================================
            # Restart Application & Clean Port 3000
            # =========================================
            echo "🔄 Stopping old instances and clearing port 3000..."

            # Find and kill any process holding port 3000
            PORT_PID=$(ss -lptn 'sport = :3000' 2>/dev/null | grep -o 'pid=[0-9]*' | head -n 1 | cut -d= -f2 || true)
            if [ -n "$PORT_PID" ]; then
              echo "Killing PID $PORT_PID holding port 3000..."
              kill -9 "$PORT_PID" 2>/dev/null || sudo kill -9 "$PORT_PID" 2>/dev/null || true
            fi

            # Clean PM2 process list
            pm2 delete all 2>/dev/null || true
            if [ -d "/home/doorstep-deploy" ]; then
              sudo -u doorstep-deploy pm2 delete all 2>/dev/null || true
            fi
            sudo pm2 delete all 2>/dev/null || true

            sleep 2

            # Start fresh PM2 worker in project directory
            echo "🚀 Starting fresh PM2 worker..."
            cd /var/www/doorstepbd.org
            pm2 start npm --name "doorstepbd" -- start || true
            pm2 save 2>/dev/null || true

            if [ -d "/home/doorstep-deploy" ]; then
              sudo -u doorstep-deploy bash -c "cd /var/www/doorstepbd.org && pm2 start npm --name 'doorstepbd' -- start && pm2 save" 2>/dev/null || true
            fi

            # =========================================
            # Clear Nginx Cache & Restart Nginx
            # =========================================
            echo "🧹 Clearing Nginx proxy cache..."
            sudo rm -rf /var/cache/nginx/* /tmp/nginx* 2>/dev/null || true

            echo "🌐 Restarting Nginx web server..."
            sudo systemctl restart nginx 2>/dev/null || sudo systemctl reload nginx 2>/dev/null || sudo nginx -s reload 2>/dev/null || true

            # =========================================
            # Server Diagnostics
            # =========================================
            echo "========================================="
            echo "🔍 Server Diagnostics"
            echo "========================================="
            echo "--- Nginx Sites Enabled ---"
            cat /etc/nginx/sites-enabled/* 2>/dev/null || true

            echo "--- PM2 Processes ---"
            pm2 list 2>/dev/null || true
            if [ -d "/home/doorstep-deploy" ]; then
              sudo -u doorstep-deploy pm2 list 2>/dev/null || true
            fi
            sudo pm2 list 2>/dev/null || true

            echo "--- Listening Ports ---"
            ss -tulpn 2>/dev/null || netstat -tulpn 2>/dev/null || true

            echo "========================================="
            echo "✅ Deployment completed successfully!"
            echo "========================================="