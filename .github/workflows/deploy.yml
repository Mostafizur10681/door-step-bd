name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            cd /var/www/doorstepbd.org

            echo "========================================="
            echo "🚀 Deploying Door Step BD"
            echo "📁 /var/www/doorstepbd.org"
            echo "========================================="

            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing dependencies..."
            npm ci

            echo "🏗️ Building Next.js..."
            npm run build

            echo "🔄 Restarting application..."
            pm2 restart doorstepbd || pm2 start npm --name "doorstepbd" -- start

            pm2 save

            echo "========================================="
            echo "✅ Deployment completed successfully!"
            echo "========================================="
